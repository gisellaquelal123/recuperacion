<html>
    <head>
        <title>FORMULARIOS</title>
    </head>
    <body>
        <form action="mailto:andrees.ec@gmail.com" method="post" enctype="text/plain">
        <h4>FORMULARIO</h4>
      <p><input class="controls" type="text" name="Nombre" id="nombre" placeholder="Ingrese su nombre"></p>  
      <p><input class="controls" type="text" name="Apellido" id="apellido" placeholder="Ingrese su apellido"></p>  
      <p><input class="controls" type="email" name="Correo" id="correo" placeholder="Ingrese su correo"></p>  
      <p><input class="controls" type="password" name="" id="password" placeholder="Ingrese su password"></p>  
      <p><textarea name="direccion" rows="5" cols="20" placeholder="Detalle su direccion domiciliaria"></textarea></p> 
      <p>Elija el curso correspondiente:</p>
      <p></p><select name="curso">
      <option value="1">Octavo Año</option>
      <option value="2">Noveno Año</option>
      <option value="3">Decimo Año</option>
      <option value="4">Primer Año Bachillerato</option>
      <option value="5">Segundo Año Bachillerato</option>
      <option value="6">Tercer Año Bachillerato</option>
      </select></p>
      <p><input type="radio" name="jornada" value="1">Matutina</p>
      <p><input type="radio" name="jornada" value="2">Vespertina</p>
      <p><input type="checkbox" name="aceptar">Acepta los terminos y condiciones</p>
      <p><input class="boton" type="RESET" value="BORRAR"></p>
      <p><input class="boton" type="submit" value="ENVIAR"></p>
      </form>
    </body>
</html>
